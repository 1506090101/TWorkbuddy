name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI 只做类型检查与构建，不需要运行 Electron，跳过其二进制下载以加速并避免网络依赖
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-buddy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-buddy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    defaults:
      run:
        working-directory: agent-buddy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-buddy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
