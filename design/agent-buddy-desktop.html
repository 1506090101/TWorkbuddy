<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Buddy · 桌面端工作台</title>
<style>
  :root{
    --bg-0:#F4F5F7; --bg-1:#FBFBFC; --bg-2:#FFFFFF; --bg-3:#FFFFFF;
    --bg-4:#F6F7F9; --bg-5:#EEF0F3; --bg-6:#E7EAEF;
    --border:#E4E7EB; --border-strong:#D5DAE1; --divider:#EDEFF2;
    --text-0:#1B1F24; --text-1:#515A66; --text-2:#8A93A0; --text-3:#A7AFBA;
    --accent:#5B5BD6; --accent-hover:#4A4AC4; --accent-soft:#EDECFB; --accent-text:#4A46C9;
    --green:#16A34A; --green-soft:#E7F6EC; --amber:#C47F12; --amber-soft:#FBF1DC;
    --red:#E0413A; --red-soft:#FCEAE9; --blue:#2563EB; --blue-soft:#E8F0FE;
    --shadow-sm:0 1px 2px rgba(20,25,35,.06),0 1px 1px rgba(20,25,35,.04);
    --shadow-md:0 4px 14px rgba(20,25,35,.10);
    --radius:10px; --radius-sm:8px; --radius-lg:14px;
    --rail:60px; --nav:236px; --ctx:340px;
    --font:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"SF Mono","JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;
  }
  [data-theme="dark"]{
    --bg-0:#0B0E14; --bg-1:#0E1219; --bg-2:#12161E; --bg-3:#141923;
    --bg-4:#1A202B; --bg-5:#212A37; --bg-6:#2A3340;
    --border:#262D38; --border-strong:#333C4A; --divider:#1E242E;
    --text-0:#E6EDF3; --text-1:#A9B4C0; --text-2:#6E7888; --text-3:#566070;
    --accent:#7B8CFF; --accent-hover:#8E9CFF; --accent-soft:#1C2138; --accent-text:#A6B2FF;
    --green:#3FB950; --green-soft:#11261A; --amber:#D9A23B; --amber-soft:#2A2310;
    --red:#F0584B; --red-soft:#2C1715; --blue:#4AA8FF; --blue-soft:#10243A;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 6px 20px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font);background:var(--bg-0);color:var(--text-0);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;}

  /* ===== App shell ===== */
  .app{display:flex;flex-direction:column;height:100vh;}
  .titlebar{height:34px;flex:0 0 34px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bg-1);border-bottom:1px solid var(--border);}
  .traffic{display:flex;gap:8px;}
  .dot{width:12px;height:12px;border-radius:50%;}
  .dot.r{background:#FF5F57;} .dot.y{background:#FEBC2E;} .dot.g{background:#28C840;}
  .titlebar .tt{font-size:12px;color:var(--text-2);font-weight:500;margin-left:6px;letter-spacing:.2px;}
  .titlebar .tt b{color:var(--text-1);font-weight:600;}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:12px;}
  .tb-right .pill{display:flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--border);border-radius:20px;background:var(--bg-2);}

  .body{flex:1;display:flex;min-height:0;}

  /* ===== App bar (top context) ===== */
  .appbar{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg-2);border-bottom:1px solid var(--border);}
  .crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-1);}
  .crumb .proj{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text-0);padding:4px 9px;border-radius:7px;background:var(--bg-4);border:1px solid var(--border);}
  .crumb .sep{color:var(--text-3);}
  .crumb .task{color:var(--text-0);font-weight:500;}
  .ctx-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border);border-radius:20px;background:var(--bg-2);font-size:12px;color:var(--text-1);white-space:nowrap;}
  .ctx-chip svg{width:13px;height:13px;color:var(--text-2);}
  .ctx-chip b{color:var(--text-0);font-weight:600;}
  .ctx-chip .ai{display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
  .appbar .sp{flex:1;}
  .meter{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--border);border-radius:18px;background:var(--bg-2);font-size:11.5px;color:var(--text-1);}
  .meter .bar{width:64px;height:6px;border-radius:4px;background:var(--bg-6);overflow:hidden;}
  .meter .bar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:4px;}
  .meter.warn .bar i{background:linear-gradient(90deg,var(--amber),var(--red));}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--bg-2);color:var(--text-0);}
  .btn:hover{background:var(--bg-5);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-hover);}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--text-1);}
  .btn.ghost:hover{background:var(--bg-5);color:var(--text-0);}
  .btn.sm{padding:5px 9px;font-size:11.5px;}
  .icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-1);border:1px solid transparent;}
  .icon-btn:hover{background:var(--bg-5);color:var(--text-0);}
  .icon-btn svg{width:17px;height:17px;}

  /* ===== Left work nav ===== */
  .rail{flex:0 0 var(--rail);width:var(--rail);background:var(--bg-1);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;overflow-y:auto;overflow-x:hidden;}
  .rail .rbtn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-2);position:relative;}
  .rail .rbtn svg{width:20px;height:20px;}
  .rail .rbtn:hover{background:var(--bg-5);color:var(--text-0);}
  .rail .rbtn.active{background:var(--accent-soft);color:var(--accent-text);}
  .rail .rbtn.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent);}
  .rail .rsep{width:24px;height:1px;background:var(--border);margin:4px 0;}
  .rail .rbtn.me{margin-top:auto;}

  .nav{flex:0 0 var(--nav);width:var(--nav);background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
  .nav-head{padding:14px 14px 10px;}
  .newtask{width:100%;justify-content:center;padding:9px;border-radius:9px;font-weight:600;}
  .nav-scroll{flex:1;overflow-y:auto;padding:4px 8px 12px;}
  .nav-group{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);padding:12px 10px 6px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-1);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:2px;}
  .nav-item svg{width:16px;height:16px;color:var(--text-2);flex:0 0 16px;}
  .nav-item:hover{background:var(--bg-5);color:var(--text-0);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-text);}
  .nav-item.active svg{color:var(--accent-text);}
  .nav-item .badge{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--text-2);background:var(--bg-6);padding:1px 7px;border-radius:10px;}
  .nav-item.active .badge{background:var(--accent);color:#fff;}
  .nav-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 30px;}
  .nav-foot .who{font-size:12.5px;font-weight:600;line-height:1.2;}
  .nav-foot .who small{display:block;color:var(--text-2);font-weight:500;font-size:11px;}

  /* ===== Main ===== */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-3);}
  .view{flex:1;min-height:0;display:none;flex-direction:column;}
  .view.active{display:flex;}

  /* workbench timeline */
  .timeline{flex:1;overflow-y:auto;padding:18px 22px 8px;}
  .tl-day{text-align:center;font-size:11px;color:var(--text-3);margin:4px 0 16px;position:relative;}
  .tl-day span{background:var(--bg-3);padding:0 10px;position:relative;z-index:1;}
  .tl-day::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--divider);}
  .ev{display:flex;gap:12px;margin-bottom:14px;}
  .ev .rail-dot{flex:0 0 28px;width:28px;display:flex;flex-direction:column;align-items:center;}
  .ev .ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-4);border:1px solid var(--border);color:var(--text-1);}
  .ev .ic svg{width:15px;height:15px;}
  .ev .ic.user{background:var(--accent);border-color:var(--accent);color:#fff;}
  .ev .ic.tool{background:var(--blue-soft);border-color:transparent;color:var(--blue);}
  .ev .ic.file{background:var(--green-soft);border-color:transparent;color:var(--green);}
  .ev .ic.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber);}
  .ev .ic.test{background:var(--green-soft);border-color:transparent;color:var(--green);}
  .ev .ic.sum{background:var(--accent-soft);border-color:transparent;color:var(--accent-text);}
  .ev .line{flex:1;min-width:0;padding-top:2px;}
  .ev .meta{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .ev .meta .who{font-weight:600;font-size:12.5px;}
  .ev .meta .time{font-size:11px;color:var(--text-3);}
  .ev .meta .tag{align-self:center;font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--bg-6);color:var(--text-2);}
  .bubble{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--text-0);box-shadow:var(--shadow-sm);}
  .bubble.user{background:var(--accent-soft);border-color:transparent;color:var(--text-0);}
  .bubble p{margin:0 0 6px;} .bubble p:last-child{margin:0;}
  .bubble code{font-family:var(--mono);font-size:12px;background:var(--bg-5);padding:1px 5px;border-radius:5px;color:var(--accent-text);}

  /* user messages on the right, agent/system on the left */
  .ev.user{justify-content:flex-end;}
  .ev.user .rail-dot{display:none;}
  .ev.user .line{flex:0 1 auto;}
  .ev.user .meta{justify-content:flex-end;}
  .ev.user .bubble{margin-left:auto;max-width:min(640px,100%);}

  /* tool call record */
  .toolrec{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .toolrec .tr-head{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;}
  .toolrec .tr-head .cmd{font-family:var(--mono);font-size:12px;color:var(--text-0);font-weight:500;}
  .toolrec .tr-head .st{margin-left:auto;font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:10px;}
  .st.ok{background:var(--green-soft);color:var(--green);}
  .st.run{background:var(--blue-soft);color:var(--blue);}
  .st.wait{background:var(--amber-soft);color:var(--amber);}
  .st.err{background:var(--red-soft);color:var(--red);}
  .toolrec .tr-body{display:none;padding:0 12px 11px;border-top:1px solid var(--divider);}
  .toolrec.open .tr-body{display:block;}
  .toolrec .tr-body pre{font-family:var(--mono);font-size:11.5px;color:var(--text-1);background:var(--bg-4);border-radius:8px;padding:9px 11px;margin-top:9px;white-space:pre-wrap;line-height:1.55;}
  .perm{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-1);margin-top:9px;padding:7px 9px;background:var(--bg-4);border-radius:8px;}
  .perm .k{font-weight:600;color:var(--text-0);}

  .confirm{background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;padding:12px;margin-top:8px;}
  .confirm .ct{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--amber);font-size:12.5px;margin-bottom:6px;}
  .confirm p{font-size:12px;color:var(--text-1);margin-bottom:10px;}
  .confirm .acts{display:flex;gap:8px;}

  .summary{background:linear-gradient(180deg,var(--accent-soft),transparent);border:1px solid var(--border);border-radius:10px;padding:13px 14px;}
  .summary h4{font-size:13px;margin-bottom:7px;display:flex;align-items:center;gap:7px;}
  .summary ul{margin:0;padding-left:18px;color:var(--text-1);font-size:12.5px;}
  .summary li{margin-bottom:3px;}

  /* ===== Composer ===== */
  .composer{flex:0 0 auto;border-top:1px solid var(--border);background:var(--bg-2);padding:10px 16px 12px;}
  .comp-box{border:1px solid var(--border-strong);border-radius:12px;background:var(--bg-3);box-shadow:var(--shadow-sm);overflow:hidden;}
  .comp-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .comp-input{padding:11px 13px;min-height:44px;color:var(--text-0);font-size:13px;outline:none;}
  .comp-input:empty::before{content:attr(data-ph);color:var(--text-3);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 13px 9px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--bg-5);border:1px solid var(--border);border-radius:16px;padding:3px 9px;color:var(--text-1);}
  .chip svg{width:12px;height:12px;color:var(--accent-text);}
  .chip .x{width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-6);color:var(--text-2);font-size:10px;}
  .comp-foot{display:flex;align-items:center;gap:4px;padding:8px 10px;border-top:1px solid var(--divider);}
  .comp-foot .ctool{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;font-size:12px;color:var(--text-1);font-weight:500;}
  .comp-foot .ctool:hover{background:var(--bg-5);color:var(--text-0);}
  .comp-foot .ctool svg{width:15px;height:15px;}
  .comp-foot .sp{flex:1;}
  .think{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);padding:6px 9px;border-radius:8px;}
  .think.on{color:var(--accent-text);background:var(--accent-soft);}

  /* ===== Right context panel ===== */
  .ctx{flex:0 0 var(--ctx);width:var(--ctx);background:var(--bg-2);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
  .ctx-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 6px;}
  .ctx-tab{flex:1;padding:11px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
  .ctx-tab:hover{color:var(--text-0);}
  .ctx-tab.active{color:var(--accent-text);border-bottom-color:var(--accent);}
  .ctx-body{flex:1;overflow-y:auto;padding:14px;}
  .panel{display:none;} .panel.active{display:block;}
  .sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);font-weight:600;margin:4px 2px 10px;}
  .goal-card{background:var(--bg-4);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;}
  .goal-card .gt{font-weight:600;font-size:13px;margin-bottom:3px;}
  .goal-card .gd{font-size:12px;color:var(--text-1);margin-bottom:10px;}
  .goal-card .prog{height:6px;border-radius:4px;background:var(--bg-6);overflow:hidden;margin-bottom:10px;}
  .goal-card .prog i{display:block;height:100%;width:60%;background:var(--accent);border-radius:4px;}
  .step{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;color:var(--text-0);}
  .step .mk{width:18px;height:18px;border-radius:50%;flex:0 0 18px;display:flex;align-items:center;justify-content:center;font-size:11px;}
  .step .mk.done{background:var(--green);color:#fff;}
  .step .mk.todo{background:var(--bg-6);color:var(--text-3);border:1px solid var(--border-strong);}
  .step .mk.doing{background:var(--blue);color:#fff;}
  .step.muted{color:var(--text-2);}

  .cs-file{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .cs-file .cf-head{display:flex;align-items:center;gap:8px;padding:10px 11px;cursor:pointer;}
  .cs-file .cf-head .fn{font-family:var(--mono);font-size:12px;color:var(--text-0);font-weight:500;}
  .cs-file .cf-head .stat{margin-left:auto;font-size:11px;font-weight:600;font-family:var(--mono);}
  .stat .add{color:var(--green);} .stat .del{color:var(--red);}
  .cs-file .cf-body{display:none;border-top:1px solid var(--divider);}
  .cs-file.open .cf-body{display:block;}
  .diff{font-family:var(--mono);font-size:11.5px;line-height:1.7;}
  .diff .dl{display:flex;padding:0 10px;white-space:pre;}
  .diff .ln{width:26px;flex:0 0 26px;color:var(--text-3);text-align:right;padding-right:10px;user-select:none;}
  .diff .add{background:var(--green-soft);color:var(--green);}
  .diff .del{background:var(--red-soft);color:var(--red);}
  .cs-acts{display:flex;gap:6px;padding:9px 11px;border-top:1px solid var(--divider);}
  .cs-acts .btn{flex:1;justify-content:center;}

  .usage .ur{margin-bottom:14px;}
  .usage .ur .uhl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .usage .ur .uhl b{font-weight:600;}
  .usage .ur .uhl span{color:var(--text-2);}
  .usage .ubar{height:7px;border-radius:5px;background:var(--bg-6);overflow:hidden;}
  .usage .ubar i{display:block;height:100%;border-radius:5px;}
  .urow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--divider);font-size:12.5px;}
  .urow .uc{font-weight:600;width:54px;flex:0 0 54px;}
  .urow .un{color:var(--text-1);flex:1;}
  .urow .uv{font-family:var(--mono);color:var(--text-0);}

  /* ===== List views (sessions/agents/providers/etc) ===== */
  .listwrap{flex:1;overflow-y:auto;padding:20px 24px;}
  .list-h{display:flex;align-items:center;margin-bottom:16px;gap:12px;}
  .list-h h2{font-size:18px;font-weight:700;letter-spacing:-.2px;}
  .list-h .sub{color:var(--text-2);font-size:12.5px;}
  .list-h .sp{flex:1;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .card{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:15px;box-shadow:var(--shadow-sm);transition:.15s;}
  .card:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong);}
  .card .ch{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .card .ch .ti{font-weight:600;font-size:14px;flex:1;min-width:0;}
  .card .ch .ti small{display:block;font-weight:500;color:var(--text-2);font-size:11.5px;margin-top:2px;}
  .card .desc{font-size:12.5px;color:var(--text-1);margin-bottom:12px;line-height:1.5;}
  .card .cf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card .cf .sp{flex:1;}
  .badge-st{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
  .badge-st .d{width:6px;height:6px;border-radius:50%;}
  .bs-run{background:var(--green-soft);color:var(--green);} .bs-run .d{background:var(--green);}
  .bs-pause{background:var(--amber-soft);color:var(--amber);} .bs-pause .d{background:var(--amber);}
  .bs-done{background:var(--blue-soft);color:var(--blue);} .bs-done .d{background:var(--blue);}
  .bs-block{background:var(--red-soft);color:var(--red);} .bs-block .d{background:var(--red);}
  .mini{font-size:11.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;}
  .mini svg{width:13px;height:13px;}
  .progress{height:5px;border-radius:4px;background:var(--bg-6);overflow:hidden;margin-top:12px;}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:4px;}

  table.tbl{width:100%;border-collapse:collapse;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);font-weight:600;padding:11px 14px;background:var(--bg-4);border-bottom:1px solid var(--border);}
  table.tbl td{padding:12px 14px;border-bottom:1px solid var(--divider);font-size:12.5px;color:var(--text-0);vertical-align:middle;}
  table.tbl tr:last-child td{border-bottom:none;}
  table.tbl tr:hover td{background:var(--bg-4);}
  table.tbl .mono{font-family:var(--mono);font-size:12px;}
  .toggle{width:36px;height:20px;border-radius:20px;background:var(--bg-6);position:relative;transition:.15s;flex:0 0 36px;}
  .toggle.on{background:var(--accent);}
  .toggle i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:var(--shadow-sm);}
  .toggle.on i{left:18px;}
  .pbar{height:6px;width:90px;border-radius:4px;background:var(--bg-6);overflow:hidden;display:inline-block;vertical-align:middle;}
  .pbar i{display:block;height:100%;border-radius:4px;}

  /* ===== Status bar ===== */
  .statusbar{height:26px;flex:0 0 26px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--bg-1);border-top:1px solid var(--border);font-size:11.5px;color:var(--text-2);}
  .statusbar .s{display:flex;align-items:center;gap:6px;}
  .statusbar .s svg{width:13px;height:13px;}
  .statusbar .sp{flex:1;}
  .statusbar .ok{color:var(--green);} .statusbar .warn{color:var(--amber);}
  .hidden{display:none !important;}

  /* ===== Overlays / Modals / Drawers / Palette / Toast ===== */
  .overlay{position:fixed;inset:0;background:rgba(15,20,30,.42);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px);}
  .overlay.open{display:flex;}
  .modal{width:580px;max-width:92vw;max-height:86vh;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border);}
  .modal-head h3{font-size:15px;font-weight:700;letter-spacing:-.2px;}
  .modal-head .sub{font-size:12px;color:var(--text-2);}
  .modal-head .x{margin-left:auto;}
  .modal-tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--border);}
  .modal-tab{padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer;}
  .modal-tab:hover{color:var(--text-0);}
  .modal-tab.active{color:var(--accent-text);border-bottom-color:var(--accent);}
  .modal-body{padding:16px 18px;overflow-y:auto;}
  .modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
  .field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--divider);}
  .field:last-child{border-bottom:none;}
  .field .fl{font-size:13px;font-weight:500;}
  .field .fl small{display:block;color:var(--text-2);font-weight:400;font-size:11.5px;margin-top:2px;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg button{padding:6px 12px;font-size:12px;font-weight:600;color:var(--text-1);background:var(--bg-2);}
  .seg button.active{background:var(--accent);color:#fff;}
  .kbd{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--text-1);background:var(--bg-5);border:1px solid var(--border);border-radius:6px;padding:2px 7px;}
  .shortcut{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--divider);font-size:12.5px;}
  .shortcut:last-child{border-bottom:none;}

  .drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:94vw;background:var(--bg-2);border-left:1px solid var(--border);box-shadow:var(--shadow-md);transform:translateX(100%);transition:transform .2s ease;z-index:51;display:flex;flex-direction:column;}
  .drawer.open{transform:none;}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--border);}
  .drawer-head h3{font-size:15px;font-weight:700;}
  .drawer-head .x{margin-left:auto;}
  .drawer-body{padding:16px;overflow-y:auto;flex:1;}
  .kv{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--divider);font-size:12.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--text-2);}
  .kv .v{font-weight:600;}
  .perm-row{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--bg-4);border-radius:8px;margin-bottom:7px;font-size:12.5px;}
  .perm-row .lv{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;}
  .lv.auto{background:var(--green-soft);color:var(--green);}
  .lv.confirm{background:var(--amber-soft);color:var(--amber);}
  .lv.deny{background:var(--red-soft);color:var(--red);}
  .doc-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer;}
  .doc-row:hover{border-color:var(--border-strong);background:var(--bg-4);}
  .doc-row .dn{font-size:12.5px;font-weight:500;font-family:var(--mono);}
  .doc-row .dm{margin-left:auto;font-size:11px;color:var(--text-2);}
  .retrieve{background:var(--bg-4);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:6px;}
  .retrieve .rq{font-size:12.5px;color:var(--text-1);margin-bottom:8px;}
  .retrieve .rq b{color:var(--text-0);}
  .chunk{font-size:12px;color:var(--text-1);padding:8px 10px;background:var(--bg-2);border:1px solid var(--divider);border-radius:8px;margin-bottom:6px;line-height:1.55;}
  .chunk .src{display:block;font-size:10.5px;color:var(--text-3);font-family:var(--mono);margin-top:4px;}

  .palette{position:fixed;top:13%;left:50%;transform:translateX(-50%);width:620px;max-width:94vw;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);z-index:60;display:none;overflow:hidden;}
  .palette.open{display:block;}
  .palette-input{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);}
  .palette-input svg{width:17px;height:17px;color:var(--text-2);}
  .palette-input input{flex:1;border:none;outline:none;background:transparent;color:var(--text-0);font-size:14px;font-family:inherit;}
  .palette-list{max-height:340px;overflow-y:auto;padding:6px;}
  .pc{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-1);}
  .pc.active,.pc:hover{background:var(--accent-soft);color:var(--accent-text);}
  .pc svg{width:16px;height:16px;opacity:.8;}
  .pc .ph{margin-left:auto;font-size:11px;color:var(--text-3);}
  .pc .tag{font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--bg-6);color:var(--text-2);}

  .toasts{position:fixed;bottom:40px;right:20px;display:flex;flex-direction:column;gap:9px;z-index:70;align-items:flex-end;}
  .toast{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);font-size:12.5px;color:var(--text-0);max-width:320px;animation:toastIn .18s ease;}
  .toast .ic{width:18px;height:18px;flex:0 0 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
  .toast.ok .ic{background:var(--green);} .toast.warn .ic{background:var(--amber);} .toast.info .ic{background:var(--accent);}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .detail-clickable{cursor:pointer;}

</head>

    const dark = document.body.getAttribute('data-theme')==='dark';
    document.body.setAttribute('data-theme', dark?'light':'dark');
    themeIcon.innerHTML = dark? moon : sun;
    document.getElementById('ctxMeter').classList.toggle('warn', false);
  });

  // Run / pause toggle
  const runBtn = document.getElementById('runBtn');
  runBtn.addEventListener('click',()=>{
    const running = runBtn.textContent.trim()==='暂停';
    runBtn.innerHTML = running
      ? '<svg viewBox="0 0 24 24" fill="none" width="13" height="13"><path d="M7 5l12 7-12 7V5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="currentColor"/></svg> 继续'
      : '<svg viewBox="0 0 24 24" fill="none" width="13" height="13"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg> 暂停';
  });

  // Thinking toggle
  const thinkBtn = document.getElementById('thinkBtn');
  thinkBtn.addEventListener('click',()=>thinkBtn.classList.toggle('on'));
</script>
</body>
</html>
